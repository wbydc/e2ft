version: 2
# A new release waits a week before it is proposed: time for a compromised or broken one to be pulled.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /ops/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # coturn's pin; move the chart's (ops/helm/e2ft/values.yaml) and web/scripts/coturn.sh's with it by hand.
  - package-ecosystem: docker-compose
    directory: /ops/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
