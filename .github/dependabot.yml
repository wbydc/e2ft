version: 2
# A new release waits a week before it is proposed: time for a compromised or broken one to be pulled.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /ops/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # coturn's pin; ops/check.sh fails until the chart and web/scripts/coturn.sh carry the same version.
  - package-ecosystem: docker-compose
    directory: /ops/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
