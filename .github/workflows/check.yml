# The gate every pull request and every push to main must pass; image.yml calls it before publishing a release.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same toolchains ops/docker/Dockerfile builds with, so the gate and the image agree.
  NODE_VERSION: 24.22.2
  RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: cargo test --locked

  # The e2e suite split over three runners, each with its own server.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npx playwright test --shard=${{ matrix.shard }}/3
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  # The one required check for lint and e2e. It runs even when they fail, since a skipped required check counts as
  # passed.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint, e2e]
    if: always()
    steps:
      - run: test "$LINT" = success && test "$E2E" = success
        env:
          LINT: ${{ needs.lint.result }}
          E2E: ${{ needs.e2e.result }}

  # The relay through a real coturn with server-signed credentials, and the specs that need a local coturn. coturn
  # runs on the job's own loopback.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends coturn=4.6.1-1build4
          # The package starts a system coturn on 3478; the specs start their own.
          sudo systemctl stop coturn || true
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: scripts/coturn.sh start
        working-directory: web
      - run: npx playwright test tests/e2e/settings.spec.ts
        working-directory: web
        env:
          E2E_TURN: "1"
      # The health check's TURN tests against the shared-secret coturn.
      - run: cargo test --locked -- --ignored
      - run: npm run integration
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-results
          path: web/test-results/
          retention-days: 7

  # The self-hosting kits: the Helm chart in each coturn mode through helm lint and kubeconform, and the compose file.
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - run: ops/check.sh

  # Any finding fails the job.
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: catches a secret added and later removed on a branch.
          fetch-depth: 0
      # As the runner user, so git inside the container trusts the checkout.
      - name: gitleaks
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git --redact --verbose --exit-code 1 .
      - name: semgrep
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src semgrep/semgrep:1.185.0
          semgrep scan --config p/default --config p/typescript --config p/rust --error --metrics=off .
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo audit
        run: cargo install cargo-audit --version 0.23.0 --locked --quiet && cargo audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Dev dependencies too: they run in CI and on contributors' machines.
      - name: npm audit
        run: npm audit
        working-directory: web
