# The pipeline every pull request and every push to main must pass, one stage per file, each waiting for the one
# before: security, lint, build, test. A release tag vX.Y.Z then publishes the image and the chart. The ruleset
# requires every job by name: a failed job reports itself, the jobs after it are skipped.
name: check

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: ./.github/workflows/security.yml

  lint:
    needs: security
    uses: ./.github/workflows/lint.yml

  build:
    needs: lint
    uses: ./.github/workflows/build.yml

  test:
    needs: build
    uses: ./.github/workflows/test.yml

  # Release tags only, after every stage passed.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
