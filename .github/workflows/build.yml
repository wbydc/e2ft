# Stage 3: the frontend, the server, and the production image. Called by ci.yml.
name: build

on:
  workflow_call:
    inputs:
      rust:
        description: Rust code changed (src/, tests/, Cargo.*).
        type: boolean
        required: true
      node:
        description: Frontend code changed (web/).
        type: boolean
        required: true
      docker:
        description: The image's own files changed (ops/docker/).
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  # The frontend the server embeds, shared with the later jobs that start a server without Node.
  web:
    if: inputs.node || inputs.rust
    runs-on: ubuntu-24.04
    container: node:26.13.1-bookworm-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # Compiling needs web/dist to exist, not its contents.
  cargo:
    if: inputs.rust
    runs-on: ubuntu-24.04
    container: rust:1.100.0-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: debug
      - run: mkdir -p web/dist && cargo build --locked --all-targets

  # Not pushed; its cache serves the release image. Its server binary, frontend embedded, is the one the test stage
  # runs, so every test job tests what the image ships without compiling its own.
  docker:
    if: inputs.node || inputs.rust || inputs.docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/docker/Dockerfile
          push: false
          load: true
          tags: e2ft:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: mkdir server && docker create --name e2ft e2ft:ci && docker cp e2ft:/e2ft server/e2ft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: server/e2ft
          retention-days: 1
