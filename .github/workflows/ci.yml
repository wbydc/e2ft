# The pipeline every pull request and every push to main must pass, one stage per file, each waiting for the one
# before: security, lint, build, test. A release tag vX.Y.Z then publishes the image and the chart. The ruleset
# requires every job by name: a failed job reports itself, the jobs after it are skipped.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed decides which jobs run: a skipped job reports itself as skipped, which the ruleset accepts. A
  # change to CI itself, or a release tag, runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.ci == 'true' || github.ref_type == 'tag' }}
      node: ${{ steps.filter.outputs.node == 'true' || steps.filter.outputs.ci == 'true' || github.ref_type == 'tag' }}
      docker: ${{ steps.filter.outputs.docker == 'true' || steps.filter.outputs.ci == 'true' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust: [src/**, tests/**, Cargo.toml, Cargo.lock]
            node: [web/**]
            docker: [ops/docker/**]
            ci: [.github/**]

  security:
    needs: changes
    uses: ./.github/workflows/security.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' }}

  lint:
    needs: [changes, security]
    uses: ./.github/workflows/lint.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' }}

  # A stage whose jobs all skipped counts as skipped, and GitHub would skip the stages after it with their checks
  # unreported: an image-only change would never build the image and never satisfy the ruleset.
  build:
    needs: [changes, lint]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' }}
      docker: ${{ needs.changes.outputs.docker == 'true' }}

  test:
    needs: [changes, build]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/test.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' }}

  # Release tags only, after every stage passed.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
