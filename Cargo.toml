[package]
name = "e2ft"
version = "0.14.9"
edition = "2024"
publish = false
repository = "https://github.com/wbydc/e2ft"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hmac = "0.13"
# The TURN long-term credential key in the health check; on the same digest release as hmac and sha1.
md-5 = "0.11"
mime_guess = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
