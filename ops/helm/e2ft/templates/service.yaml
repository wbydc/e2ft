apiVersion: v1
kind: Service
metadata:
  name: {{ include "e2ft.fullname" . }}
  labels:
    {{- include "e2ft.labels" . | nindent 4 }}
    {{- include "e2ft.selector" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "e2ft.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
