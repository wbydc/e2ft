{{- if .Values.coturn.enabled }}
{{- $name := printf "%s-coturn" (include "e2ft.fullname" .) }}
{{- $hostNetwork := eq .Values.coturn.mode "hostNetwork" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2ft.labels" . | nindent 4 }}
    {{- include "e2ft.coturnSelector" . | nindent 4 }}
data:
  # static-auth-secret is appended at start from the Secret.
  turnserver.conf: |
    listening-port={{ .Values.coturn.port }}
    {{- if and $hostNetwork .Values.coturn.listeningIp }}
    listening-ip={{ .Values.coturn.listeningIp }}
    relay-ip={{ .Values.coturn.listeningIp }}
    {{- end }}
    {{- with .Values.coturn.externalIp }}
    external-ip={{ . }}
    {{- end }}
    min-port={{ .Values.coturn.minPort }}
    max-port={{ .Values.coturn.maxPort }}
    realm={{ .Values.coturn.host }}
    use-auth-secret
    fingerprint
    no-tls
    no-tcp-relay
    no-multicast-peers
    no-software-attribute
    no-cli
    no-rfc5780
    user-quota={{ .Values.coturn.userQuota }}
    # One allocation per relay port.
    total-quota={{ add (sub (int .Values.coturn.maxPort) (int .Values.coturn.minPort)) 1 }}
    stale-nonce=600
    # No relaying into private, cluster, loopback, link-local or reserved ranges.
    denied-peer-ip=0.0.0.0-0.255.255.255
    denied-peer-ip=10.0.0.0-10.255.255.255
    denied-peer-ip=100.64.0.0-100.127.255.255
    denied-peer-ip=127.0.0.0-127.255.255.255
    denied-peer-ip=169.254.0.0-169.254.255.255
    denied-peer-ip=172.16.0.0-172.31.255.255
    denied-peer-ip=192.168.0.0-192.168.255.255
    denied-peer-ip=192.0.0.0-192.0.0.255
    denied-peer-ip=198.18.0.0-198.19.255.255
    denied-peer-ip=240.0.0.0-255.255.255.255
    denied-peer-ip=::1
    denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    # No logs: the relay sees peer addresses.
    no-stdout-log
    log-file=/dev/null
    simple-log
    pidfile=/run/coturn/turnserver.pid
    userdb=/run/coturn/turndb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2ft.labels" . | nindent 4 }}
    {{- include "e2ft.coturnSelector" . | nindent 4 }}
spec:
  replicas: 1
  # Two pods would fight over the host ports and split allocations.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "e2ft.coturnSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "e2ft.coturnSelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" .Values.coturn .Values.turn.secret | sha256sum }}
    spec:
      {{- if $hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.coturn.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coturn.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Writes the config with the secret into a memory volume, so the secret never shows in a command line.
      initContainers:
        - name: config
          image: {{ .Values.coturn.image }}
          command:
            - sh
            - -c
            - umask 077 && cp /config/turnserver.conf /run/coturn/ && printf 'static-auth-secret=%s\n' "$TURN_SECRET" >> /run/coturn/turnserver.conf
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "e2ft.secretName" . }}
                  key: {{ include "e2ft.secretKey" . }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: run, mountPath: /run/coturn }
          resources:
            limits: { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: coturn
          image: {{ .Values.coturn.image }}
          args: [-c, /run/coturn/turnserver.conf]
          ports:
            - { name: turn-udp, containerPort: {{ .Values.coturn.port }}, protocol: UDP }
            - { name: turn-tcp, containerPort: {{ .Values.coturn.port }}, protocol: TCP }
          readinessProbe:
            tcpSocket:
              {{- if and $hostNetwork .Values.coturn.listeningIp }}
              host: {{ .Values.coturn.listeningIp }}
              {{- end }}
              port: {{ .Values.coturn.port }}
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              {{- if and $hostNetwork .Values.coturn.listeningIp }}
              host: {{ .Values.coturn.listeningIp }}
              {{- end }}
              port: {{ .Values.coturn.port }}
            periodSeconds: 30
          volumeMounts:
            - { name: run, mountPath: /run/coturn }
          resources:
            {{- toYaml .Values.coturn.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # turnserver carries a file capability; without it in the bounding set exec fails with EPERM.
              add: [NET_BIND_SERVICE]
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
{{- if not $hostNetwork }}
---
# Local keeps the browsers' source addresses, which TURN permissions are checked against.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2ft.labels" . | nindent 4 }}
    {{- include "e2ft.coturnSelector" . | nindent 4 }}
  {{- with .Values.coturn.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    {{- include "e2ft.coturnSelector" . | nindent 4 }}
  ports:
    - { name: turn-udp, port: {{ .Values.coturn.port }}, targetPort: turn-udp, protocol: UDP }
    - { name: turn-tcp, port: {{ .Values.coturn.port }}, targetPort: turn-tcp, protocol: TCP }
    {{- range $port := untilStep (int .Values.coturn.minPort) (int (add .Values.coturn.maxPort 1)) 1 }}
    - { name: relay-{{ $port }}, port: {{ $port }}, protocol: UDP }
    {{- end }}
{{- end }}
{{- end }}
